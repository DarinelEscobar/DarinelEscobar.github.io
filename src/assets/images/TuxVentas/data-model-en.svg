<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">TuxVentas: core marketplace relationships</title><desc id="desc">Conceptual diagram of users, listings, conversations, messages and reviews.</desc>
<rect width="1600" height="900" fill="#f4f7f4"/><rect x="65" y="58" width="1470" height="784" rx="30" fill="#fff"/>
<text x="130" y="145" fill="#138363" font-family="Arial" font-size="21" font-weight="700" letter-spacing="4">TUXVENTAS · CONCEPTUAL MODEL</text><text x="130" y="210" fill="#14283b" font-family="Arial" font-size="47" font-weight="700">Marketplace data and interactions</text><text x="130" y="257" fill="#597080" font-family="Arial" font-size="24">Simplified view based on migrations, controllers and project documentation.</text>
<g fill="none" stroke="#86bda9" stroke-width="4"><path d="M410 423 H555"/><path d="M885 423 H1030"/><path d="M720 497 V601"/><path d="M1195 497 V601"/></g>
<g font-family="Arial"><rect x="130" y="340" width="280" height="157" rx="18" fill="#eff8f2" stroke="#cde8d5"/><text x="158" y="394" fill="#173a32" font-size="27" font-weight="700">Users</text><text x="158" y="435" fill="#50736a" font-size="20">Buyers and sellers</text><text x="158" y="468" fill="#50736a" font-size="20">roles and accounts</text>
<rect x="555" y="340" width="330" height="157" rx="18" fill="#eff8f2" stroke="#cde8d5"/><text x="583" y="394" fill="#173a32" font-size="27" font-weight="700">Listings</text><text x="583" y="435" fill="#50736a" font-size="20">Category, price and images</text><text x="583" y="468" fill="#50736a" font-size="20">associated with the seller</text>
<rect x="1030" y="340" width="365" height="157" rx="18" fill="#eaf4fb" stroke="#cbdfea"/><text x="1058" y="394" fill="#173a52" font-size="27" font-weight="700">Conversations</text><text x="1058" y="435" fill="#526d80" font-size="20">Buyer, seller</text><text x="1058" y="468" fill="#526d80" font-size="20">and listing</text>
<rect x="555" y="601" width="330" height="125" rx="18" fill="#fff6e9" stroke="#f3dfc0"/><text x="583" y="653" fill="#664522" font-size="27" font-weight="700">Reviews</text><text x="583" y="691" fill="#887253" font-size="20">Linked to interactions</text>
<rect x="1030" y="601" width="365" height="125" rx="18" fill="#eaf4fb" stroke="#cbdfea"/><text x="1058" y="653" fill="#173a52" font-size="27" font-weight="700">Messages</text><text x="1058" y="691" fill="#526d80" font-size="20">Conversation history</text>
<text x="130" y="789" fill="#718397" font-size="18">Illustrative diagram · Not the complete schema or evidence of integrated payments.</text></g></svg>
