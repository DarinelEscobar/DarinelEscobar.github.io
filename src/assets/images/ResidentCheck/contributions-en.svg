<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Resident Check: access and reporting</title><desc id="desc">Diagram of documented contributions to access, statements and downloads.</desc><rect width="1600" height="900" fill="#f1f5fa"/><rect x="65" y="58" width="1470" height="784" rx="30" fill="#fff"/><g font-family="Arial"><text x="130" y="145" fill="#3175ad" font-size="21" font-weight="700" letter-spacing="4">RESIDENT CHECK · DOCUMENTED CONTRIBUTIONS</text><text x="130" y="210" fill="#172c44" font-size="47" font-weight="700">Access, statements and downloads</text><text x="130" y="257" fill="#607286" font-size="24">Maintenance and incremental features for an existing platform.</text><rect x="130" y="330" width="405" height="330" rx="22" fill="#f1f7fd"/><text x="160" y="385" fill="#3279b3" font-size="22" font-weight="700">01 · ACCESS</text><text x="160" y="448" fill="#1a354f" font-size="29" font-weight="700">Account recovery</text><text x="160" y="495" fill="#546d81" font-size="21">Email-based token</text><text x="160" y="531" fill="#546d81" font-size="21">and invited-user passwords</text><rect x="595" y="330" width="405" height="330" rx="22" fill="#edf8f6"/><text x="625" y="385" fill="#188674" font-size="22" font-weight="700">02 · REPORTING</text><text x="625" y="448" fill="#1a354f" font-size="29" font-weight="700">Account statement</text><text x="625" y="495" fill="#546d81" font-size="21">PDF generation</text><text x="625" y="531" fill="#546d81" font-size="21">and preview</text><rect x="1060" y="330" width="405" height="330" rx="22" fill="#fff7ee"/><text x="1090" y="385" fill="#b27831" font-size="22" font-weight="700">03 · COMPATIBILITY</text><text x="1090" y="448" fill="#1a354f" font-size="29" font-weight="700">iOS downloads</text><text x="1090" y="495" fill="#546d81" font-size="21">Fixes for QR codes</text><text x="1090" y="531" fill="#546d81" font-size="21">and mobile reports</text><text x="130" y="764" fill="#728397" font-size="18">Contribution diagram based on authored commits · Not the complete product.</text></g></svg>
