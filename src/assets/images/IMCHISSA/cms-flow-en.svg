<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">IMCHISSA: website and editable content</title><desc id="desc">Conceptual diagram connecting content administration and public pages.</desc><rect width="1600" height="900" fill="#f5f5f4"/><rect x="65" y="58" width="1470" height="784" rx="30" fill="#fff"/><g font-family="Arial"><text x="130" y="145" fill="#b5722d" font-size="21" font-weight="700" letter-spacing="4">IMCHISSA · FULL-STACK CONTRIBUTION</text><text x="130" y="210" fill="#252c35" font-size="47" font-weight="700">From editable content to public pages</text><text x="130" y="257" fill="#697682" font-size="24">Conceptual flow based on the CMS, catalog and public pages.</text><rect x="130" y="340" width="365" height="285" rx="22" fill="#f8f1e8"/><text x="163" y="400" fill="#a76528" font-size="21" font-weight="700">CONTENT</text><text x="163" y="460" fill="#293340" font-size="30" font-weight="700">CMS administration</text><text x="163" y="510" fill="#6a747d" font-size="21">Sections, copy and files</text><text x="163" y="545" fill="#6a747d" font-size="21">editable by the team</text><path d="M515 480 H565" stroke="#c9a578" stroke-width="4"/><rect x="585" y="340" width="365" height="285" rx="22" fill="#eef4f7"/><text x="618" y="400" fill="#56788e" font-size="21" font-weight="700">APPLICATION</text><text x="618" y="460" fill="#293340" font-size="30" font-weight="700">Laravel + data</text><text x="618" y="510" fill="#6a747d" font-size="21">Validation, catalog</text><text x="618" y="545" fill="#6a747d" font-size="21">and public assets</text><path d="M970 480 H1020" stroke="#c9a578" stroke-width="4"/><rect x="1040" y="340" width="425" height="285" rx="22" fill="#f2f7ef"/><text x="1073" y="400" fill="#628453" font-size="21" font-weight="700">WEBSITE</text><text x="1073" y="460" fill="#293340" font-size="30" font-weight="700">Public pages</text><text x="1073" y="510" fill="#6a747d" font-size="21">Home, trailers, ramps,</text><text x="1073" y="545" fill="#6a747d" font-size="21">services and contact</text><text x="130" y="764" fill="#81909a" font-size="18">Illustrative diagram · Team development; not a CMS screenshot.</text></g></svg>
