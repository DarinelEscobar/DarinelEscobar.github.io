<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">IMCHISSA: sitio y contenido administrable</title><desc id="desc">Diagrama conceptual de la relación entre administración de contenido y páginas públicas.</desc><rect width="1600" height="900" fill="#f5f5f4"/><rect x="65" y="58" width="1470" height="784" rx="30" fill="#fff"/><g font-family="Arial"><text x="130" y="145" fill="#b5722d" font-size="21" font-weight="700" letter-spacing="4">IMCHISSA · PARTICIPACIÓN FULL STACK</text><text x="130" y="210" fill="#252c35" font-size="47" font-weight="700">Del contenido administrable al sitio público</text><text x="130" y="257" fill="#697682" font-size="24">Flujo conceptual basado en el CMS, el catálogo y las vistas públicas del proyecto.</text><rect x="130" y="340" width="365" height="285" rx="22" fill="#f8f1e8"/><text x="163" y="400" fill="#a76528" font-size="21" font-weight="700">CONTENIDO</text><text x="163" y="460" fill="#293340" font-size="30" font-weight="700">Administración CMS</text><text x="163" y="510" fill="#6a747d" font-size="21">Secciones, textos y archivos</text><text x="163" y="545" fill="#6a747d" font-size="21">editables por el equipo</text><path d="M515 480 H565" stroke="#c9a578" stroke-width="4"/><rect x="585" y="340" width="365" height="285" rx="22" fill="#eef4f7"/><text x="618" y="400" fill="#56788e" font-size="21" font-weight="700">APLICACIÓN</text><text x="618" y="460" fill="#293340" font-size="30" font-weight="700">Laravel + datos</text><text x="618" y="510" fill="#6a747d" font-size="21">Validación, catálogo</text><text x="618" y="545" fill="#6a747d" font-size="21">y recursos públicos</text><path d="M970 480 H1020" stroke="#c9a578" stroke-width="4"/><rect x="1040" y="340" width="425" height="285" rx="22" fill="#f2f7ef"/><text x="1073" y="400" fill="#628453" font-size="21" font-weight="700">SITIO</text><text x="1073" y="460" fill="#293340" font-size="30" font-weight="700">Páginas públicas</text><text x="1073" y="510" fill="#6a747d" font-size="21">Inicio, remolques, rampas,</text><text x="1073" y="545" fill="#6a747d" font-size="21">servicios y contacto</text><text x="130" y="764" fill="#81909a" font-size="18">Diagrama explicativo · Desarrollo compartido en equipo; no es una captura del CMS.</text></g></svg>
