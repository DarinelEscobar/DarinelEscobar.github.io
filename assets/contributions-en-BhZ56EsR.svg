<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Voldo: documents and sales orders</title><desc id="desc">Overview of documented, targeted contributions to customer and sales workflows.</desc>
  <rect width="1600" height="900" fill="#f3f5f8"/><rect x="65" y="58" width="1470" height="784" rx="30" fill="#fff"/>
  <g font-family="Arial, sans-serif"><text x="130" y="145" fill="#316b91" font-size="21" font-weight="700" letter-spacing="4">VOLDO · DOCUMENTED CONTRIBUTIONS</text><text x="130" y="210" fill="#203346" font-size="47" font-weight="700">Documents and sales orders</text><text x="130" y="257" fill="#667b8e" font-size="24">Targeted contributions to an existing application.</text>
    <rect x="130" y="330" width="405" height="330" rx="22" fill="#eff6fb"/><text x="160" y="385" fill="#316b91" font-size="22" font-weight="700">01 · CUSTOMERS</text><text x="160" y="448" fill="#203346" font-size="29" font-weight="700">Documents</text><text x="160" y="495" fill="#61778b" font-size="21">Persistence and handling</text><text x="160" y="531" fill="#61778b" font-size="21">through customer forms</text>
    <rect x="595" y="330" width="405" height="330" rx="22" fill="#eef7f5"/><text x="625" y="385" fill="#308577" font-size="22" font-weight="700">02 · SALES</text><text x="625" y="448" fill="#203346" font-size="29" font-weight="700">Order attachments</text><text x="625" y="495" fill="#61778b" font-size="21">Documents and images</text><text x="625" y="531" fill="#61778b" font-size="21">in sales workflows</text>
    <rect x="1060" y="330" width="405" height="330" rx="22" fill="#fbf5ed"/><text x="1090" y="385" fill="#a17b41" font-size="22" font-weight="700">03 · MAINTENANCE</text><text x="1090" y="448" fill="#203346" font-size="29" font-weight="700">Sale validation</text><text x="1090" y="495" fill="#61778b" font-size="21">Layout adjustments</text><text x="1090" y="531" fill="#61778b" font-size="21">to existing screens</text>
    <text x="130" y="764" fill="#778a9a" font-size="18">Diagram based on documented contributions · Not a product screenshot.</text></g>
