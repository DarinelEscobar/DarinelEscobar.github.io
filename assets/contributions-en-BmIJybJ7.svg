<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">EcoBrush: catalog and store operations</title><desc id="desc">Overview of documented contributions to the catalog, point of sale and support.</desc>
  <rect width="1600" height="900" fill="#f3f5ef"/><rect x="65" y="58" width="1470" height="784" rx="30" fill="#fff"/>
  <g font-family="Arial, sans-serif"><text x="130" y="145" fill="#437d55" font-size="21" font-weight="700" letter-spacing="4">ECOBRUSH · DOCUMENTED CONTRIBUTIONS</text><text x="130" y="210" fill="#20372b" font-size="47" font-weight="700">Catalog and store operations</text><text x="130" y="257" fill="#68796c" font-size="24">Features and maintenance for existing systems.</text>
    <rect x="130" y="330" width="405" height="330" rx="22" fill="#edf6ed"/><text x="160" y="385" fill="#437d55" font-size="22" font-weight="700">01 · DISTRIBUTION + POS</text><text x="160" y="448" fill="#20372b" font-size="29" font-weight="700">Master catalog</text><text x="160" y="495" fill="#607266" font-size="21">Product integration</text><text x="160" y="531" fill="#607266" font-size="21">and SKU handling</text>
    <rect x="595" y="330" width="405" height="330" rx="22" fill="#f4f7ec"/><text x="625" y="385" fill="#6d823f" font-size="22" font-weight="700">02 · POINT OF SALE</text><text x="625" y="448" fill="#20372b" font-size="29" font-weight="700">Checkout and orders</text><text x="625" y="495" fill="#607266" font-size="21">Calculation validation</text><text x="625" y="531" fill="#607266" font-size="21">and replenishment</text>
    <rect x="1060" y="330" width="405" height="330" rx="22" fill="#f9f5ec"/><text x="1090" y="385" fill="#9b7641" font-size="22" font-weight="700">03 · SUPPORT</text><text x="1090" y="448" fill="#20372b" font-size="29" font-weight="700">Existing workflows</text><text x="1090" y="495" fill="#607266" font-size="21">Quotes, warranties</text><text x="1090" y="531" fill="#607266" font-size="21">and service documents</text>
    <text x="130" y="764" fill="#758579" font-size="18">Diagram based on documented contributions · Not a product screenshot.</text></g>
